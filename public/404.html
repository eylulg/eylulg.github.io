<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Eylül Güneş</title>
        <script>
            // GitHub Pages SPA fallback, based on https://github.com/rafgraph/spa-github-pages (MIT).
            // Turns /projects/ui?x=1 into /?/projects/ui&x=1; index.html restores the real URL.
            // pathSegmentsToKeep is 0 because this is a user site served from the domain root.
            var pathSegmentsToKeep = 0;
            var l = window.location;
            l.replace(
                l.protocol +
                    "//" +
                    l.hostname +
                    (l.port ? ":" + l.port : "") +
                    l.pathname
                        .split("/")
                        .slice(0, 1 + pathSegmentsToKeep)
                        .join("/") +
                    "/?/" +
                    l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
                    (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
                    l.hash,
            );
        </script>
    </head>
    <body></body>
</html>
